[package]
name = "overleaf-bridge"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "emacs-collab bridge for Overleaf (socket.io 0.9 real-time protocol)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread","macros","sync","time","io-util","io-std","fs","net","signal"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect","rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink","std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls","cookies","json","multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rand = "0.8"

[profile.release]
opt-level = 2

[[bin]]
name = "overleaf_bridge"
path = "src/main.rs"
